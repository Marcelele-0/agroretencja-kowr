[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agroretencja"
version = "0.1.0"
description = "Cyfrowy asystent retencji wody i bilansu wodnego dla dzialek rolnych (HackNation 2026 - KOWR)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "shapely>=2.0",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "lightgbm>=4.5",
  "pillow>=11.0",
  "matplotlib>=3.9",
  "jinja2>=3.1",
  "weasyprint>=63.0",
]

[dependency-groups]
train = [
  "torch>=2.5",
  "stable-baselines3>=2.4",
  "gymnasium>=1.0",
  "scikit-learn>=1.5",
  "optuna>=4.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hydro_core", "src/backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
