[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agroretencja"
version = "0.1.0"
description = "Cyfrowy asystent retencji wody i bilansu wodnego dla dzialek rolnych (HackNation 2026 - KOWR)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "shapely>=2.0",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "lightgbm>=4.5",
  "pillow>=11.0",
  "matplotlib>=3.9",
  "jinja2>=3.1",
  "weasyprint>=63.0",
  "pyyaml>=6.0",
]

[dependency-groups]
train = [
  "torch>=2.5",
  "stable-baselines3>=2.4",
  "sb3-contrib>=2.4",
  "gymnasium>=1.0",
  "tensorboard>=2.17",
  "tqdm>=4.66",
  "rich>=13.7",
  "scikit-learn>=1.5",
  "optuna>=4.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "zarr>=3.0",
  "xarray>=2025.1",
  "fsspec>=2024.10",
  "aiohttp>=3.10",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.uv.sources]
# CPU-only torch: PPO with a small MLP gains nothing from the GPU (parallel CPU envs matter).
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/hydro_core", "src/backend", "ml/rl_irrigator/kowr_rl"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "ml/rl_irrigator/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
