# RL irrigation module configuration. Every change of reward or hyperparameters is
# logged in EXPERIMENTS.md together with the validation result.

# Policy used by recommend() by default: "rl" or "fao_rule". Set by the M5 decision point.
# Test 2025-2026 (reports/evaluation.md): RL (E5_s3) vs FAO overall +0.09 pp yield, -5.9 mm water
# (both significant), significant wins at budgets 100/150/250 mm, but a statistical TIE at 50 mm.
# The pre-registered rule requires a significant win at EVERY budget -> "not ready": FAO stays the
# default and the RL agent is available as experimental via policy="rl".
default_policy: fao_rule

actions_mm: [0, 10, 20, 30]

split:
  train_years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
  val_years: [2024]
  test_years: [2025, 2026]

episode:
  budget_mm: [0, 250]       # uniform, rounded down to 10 mm
  budget_step_mm: 10
  crops: [kukurydza, ziemniak, pszenica_ozima, burak_cukrowy]
  soil_categories: [1, 2, 3, 4]

reward:
  # r_t = -Ky (ETc_t - ETa_t) / ETc_season_est - c_w I_t - c_p DP_t   (units: relative yield)
  c_w: 0.0002   # per mm irrigation (1 pp of yield ~ 50 mm)
  c_p: 0.0001   # per mm deep percolation

# Synthetic forecast used in training (true precipitation + noise), per target day and lead j=1..7:
#   F = P_true * median_ratio * LogNormal(0, sigma_j)
#   with prob miss_prob_j a rain day (P > rain_threshold) is "missed": F = P_true * U(0, miss_factor_max)
#   with prob false_alarm_prob_j a dry day gets F += Exponential(false_alarm_mean_j)
# A list [a, b] means a at lead 1 and +b per extra lead day.
# Calibrated against real ECMWF IFS 0.25 forecasts of the VALIDATION year 2024 (50 points,
# Apr-Sep): scripts/calibrate_forecast.py -> reports/forecast_calibration.json (EXPERIMENTS.md E0).
forecast_noise:
  rain_threshold_mm: 1.0
  median_ratio: 0.85
  sigma: [0.85, 0.04]
  miss_prob: [0.13, 0.04]
  miss_factor_max: 0.2
  false_alarm_prob: [0.08, 0.03]
  false_alarm_mean_mm: [3.3, 0.35]

observation:
  # Normalisation scales (VecNormalize adds running normalisation on top in training).
  precip_7d_scale_mm: 50.0
  et0_7d_scale_mm: 35.0
  forecast_scale_mm: 50.0
  budget_scale_mm: 250.0
  taw_scale_mm: 250.0

baselines:
  calendar:
    dose_mm: 20
    min_interval_days: 7
    max_interval_days: 30
    stages: [dev, mid]
  fao_rule:
    max_dose_mm: 30
  fao_forecast:
    skip_if_forecast_3d_mm: 10.0
  oracle:
    dr_step_mm: 2.0

ppo:
  n_envs: 16
  net_arch: [128, 128]
  gamma: 0.995
  gae_lambda: 0.95
  n_steps: 512
  batch_size: 4096
  learning_rate: 0.0003
  ent_coef: 0.01
  n_epochs: 10
  clip_range: 0.2
  total_timesteps: 3000000
  eval_freq_steps: 100000
  n_eval_episodes: 400
  seeds: [1, 2, 3]

evaluation:
  budget_levels_mm: [50, 100, 150, 250]
  forecast_noise_seeds: [101, 102, 103]
  bootstrap_reps: 2000
  ready_rule:
    max_yield_drop_pp: 1.0
